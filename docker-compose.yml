services:
  postgres:
    image: postgres:17
    container_name: supplyiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - supplyiq_postgres_data:/var/lib/postgresql/data

volumes:
  supplyiq_postgres_data: