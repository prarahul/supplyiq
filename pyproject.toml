[project]
name = "supplyiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul Kumar", email = "prathamskt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faker>=40.40.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "tqdm>=4.70.1",
]

[project.scripts]
supplyiq = "supplyiq:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
